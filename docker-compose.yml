services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: hai-radio-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin_radio
      MINIO_ROOT_PASSWORD: password_radio_123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data:
